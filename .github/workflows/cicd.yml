name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: hearo-frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: hearo-frontend

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Validate production API URL
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL }}
        run: |
          test -n "${EXPO_PUBLIC_API_BASE_URL}"
          case "${EXPO_PUBLIC_API_BASE_URL}" in
            https://*) ;;
            *) echo "FRONTEND_API_BASE_URL must start with https://" >&2; exit 1 ;;
          esac

      - name: Build web application
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL }}
        run: npm run build

  build-and-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=${{ vars.FRONTEND_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    name: Update Kubernetes manifest for Argo CD
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update frontend image
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          sed -i \
            "s|image: .*amazonaws.com/hearo-frontend:.*|image: ${NEW_IMAGE}|" \
            k8s/hearo-frontend.yaml

      - name: Commit and push manifest update
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/hearo-frontend.yaml

          if git diff --staged --quiet; then
            echo "Manifest is already up to date."
            exit 0
          fi

          git commit -m "ci: deploy frontend ${IMAGE_TAG} [skip ci]"
          git push origin main
