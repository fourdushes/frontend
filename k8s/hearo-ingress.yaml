apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hearo-web-tls
spec:
  secretName: hearo-web-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - beta.hearo-hearo.com

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hearo-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: hearo-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - beta.hearo-hearo.com
      secretName: hearo-web-tls
  rules:
    - host: beta.hearo-hearo.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hearo-backend
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hearo-frontend
                port:
                  number: 80
