apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hearo-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hearo-backend
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hearo-frontend
                port:
                  number: 80
